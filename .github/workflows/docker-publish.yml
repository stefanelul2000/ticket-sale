name: Build and publish container

on:
  push:
    branches: [ dev ]
    tags: [ 'v*', 'release-*' ]
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/ticket-sale

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute version tag
        run: |
          DATE_TAG=$(date +%Y.%m)
          echo "DATE_TAG=${DATE_TAG}" >> $GITHUB_ENV
          echo "VERSION_TAG=${DATE_TAG}-v${GITHUB_RUN_NUMBER}" >> $GITHUB_ENV

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:dev-latest
            ${{ env.IMAGE_NAME }}:${{ env.VERSION_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Integration smoke test (healthcheck)
        run: |
          docker network create ticket-sale-ci || true
          
          docker run -d --name mysql-ci --network ticket-sale-ci \
            -e MYSQL_DATABASE=ticket_sale \
            -e MYSQL_USER=ticket_user \
            -e MYSQL_PASSWORD=ticket_pass \
            -e MYSQL_ROOT_PASSWORD=rootpass \
            mysql:8.0

          # Wait for MySQL
          for i in {1..30}; do
            if docker exec mysql-ci mysql -u root -prootpass -e "SELECT 1;" >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done

          docker run -d --name app-ci --network ticket-sale-ci -p 8080:80 \
            -e APP_ENV=production \
            -e APP_DEBUG=false \
            -e DB_HOST=mysql-ci \
            -e DB_DATABASE=ticket_sale \
            -e DB_USERNAME=ticket_user \
            -e DB_PASSWORD=ticket_pass \
            -e CACHE_DRIVER=file \
            -e SESSION_DRIVER=file \
            -e QUEUE_CONNECTION=sync \
            -e VITE_API_URL=http://localhost:8080/api \
            ${{ env.IMAGE_NAME }}:dev-latest

          # Wait for health endpoint
          for i in {1..40}; do
            if curl -fsS http://localhost:8080/api/health >/dev/null 2>&1; then
              echo "Healthcheck OK"
              exit 0
            fi
            sleep 2
          done

          echo "Healthcheck failed"
          docker logs app-ci || true
          exit 1

        shell: bash

      - name: Cleanup test containers
        if: always()
        run: |
          docker rm -f app-ci mysql-ci 2>/dev/null || true
          docker network rm ticket-sale-ci 2>/dev/null || true
