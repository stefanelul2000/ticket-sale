name: Prevent Sensitive Files in Commits

on:
  pull_request:
  push:
    branches: [ master ]

jobs:
  block_sensitive_files:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine changed files
        id: changed
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_REF="${{ github.event.pull_request.base.ref }}"
            echo "Base ref: $BASE_REF"
            git fetch --depth=1 origin "$BASE_REF" || true
            CHANGED=$(git diff --name-only "origin/$BASE_REF"...HEAD || true)
          else
            # push to master - compare previous commit
            CHANGED=$(git diff --name-only HEAD^..HEAD || true)
          fi
          echo "changed=$CHANGED" >> $GITHUB_OUTPUT

      - name: Run sensitive files check
        run: |
          set -euo pipefail
          CHANGED="${{ steps.changed.outputs.changed }}"
          if [ -z "$CHANGED" ]; then
            echo "No changed files detected"
            exit 0
          fi
          # Make script executable
          chmod +x ./scripts/check-sensitive-files.sh
          echo "$CHANGED" | xargs -r ./scripts/check-sensitive-files.sh
