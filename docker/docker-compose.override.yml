# Local development on top of docker-compose.yml:
#   DATA_DIR=./local DB_PASSWORD=dev DB_ROOT_PASSWORD=dev \
#   docker compose -f docker-compose.yml -f docker-compose.override.yml up -d --build
services:
  app:
    image: ticket-sale:dev
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8080
      FRONTEND_URL: http://localhost:8080
      SESSION_SECURE_COOKIE: "false"
      GENERATE_L5_SWAGGER_ON_STARTUP: "true"
    volumes:
      - ../app/backend/app:/var/www/html/app
      - ../app/backend/routes:/var/www/html/routes
      - ../app/backend/config:/var/www/html/config
      - ../app/backend/database:/var/www/html/database

  db:
    ports:
      - "127.0.0.1:3306:3306"
