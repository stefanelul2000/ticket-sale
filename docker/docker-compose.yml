services:
  app:
    container_name: ticket-sale-app
    build:
      context: ../app
      dockerfile: ../docker/Dockerfile
    volumes:
      - ../app/backend:/var/www/html
    env_file:
      - ../app/backend/.env
    depends_on:
      - db
      - redis
    working_dir: /var/www/html
    command: >
      sh -c "
      php -r 'for ($$i = 0; $$i < 60; $$i++) { if (@fsockopen(\"db\", 3306)) { exit(0);} sleep(1);} exit(1);' &&
      php artisan migrate --force &&
      php artisan db:seed --force &&
      php-fpm
      "

  web:
    container_name: ticket-sale-web
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ../app/backend:/var/www/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  db:
    container_name: ticket-sale-db
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ticket_sale
      MYSQL_USER: ticket_user
      MYSQL_PASSWORD: ticket_pass
      MYSQL_ROOT_PASSWORD: rootpass
    ports:
      - "3306:3306"
    volumes:
      - db-data:/var/lib/mysql

  redis:
    container_name: ticket-sale-redis
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  db-data:
