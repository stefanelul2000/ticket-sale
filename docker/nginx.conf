server {
    listen 80 default_server;
    server_name _;
    root /var/www/html/public;
    index index.php;

    # Fingerprinted Vite bundles: cache forever.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Runtime config and SPA shell must never be cached (Cloudflare included).
    location = /config.js {
        try_files $uri =404;
        add_header Cache-Control "no-store";
    }

    # Uploaded files (logos): static only, never executed.
    location /storage/ {
        location ~ \.(php|phtml|phar)$ { deny all; }
        try_files $uri =404;
        expires 7d;
    }

    # Everything else (API + SPA routes) goes through Laravel.
    location / {
        try_files $uri /index.php?$query_string;
    }

    location = /index.php {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass unix:/run/php-fpm.sock;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_read_timeout 120s;
    }

    # No other PHP file is reachable.
    location ~ \.php$ { return 404; }
    location ~ /\.(?!well-known) { deny all; }
}
